<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Download de Aula HLS</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0b1120;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .container {
      width: 100%;
      max-width: 620px;
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .header-icon {
      font-size: 28px;
      background: #0284c7;
      width: 48px;
      height: 48px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .header-title h1 {
      font-size: 20px;
      font-weight: 700;
      color: #f8fafc;
    }
    .header-title p {
      font-size: 13px;
      color: #94a3b8;
    }
    .row {
      display: flex;
      gap: 12px;
    }
    .field-group {
      margin-bottom: 16px;
      flex: 1;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #cbd5e1;
    }
    input[type="text"], select {
      width: 100%;
      padding: 10px 12px;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #f8fafc;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus, select:focus {
      border-color: #38bdf8;
    }
    .url-display {
      font-size: 12px;
      font-family: monospace;
      color: #94a3b8;
      background: #0f172a;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      word-break: break-all;
      max-height: 60px;
      overflow-y: auto;
    }
    .progress-section {
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid #334155;
      display: none;
    }
    .progress-bar-bg {
      background-color: #0f172a;
      height: 12px;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 12px;
      border: 1px solid #334155;
    }
    .progress-bar-fill {
      background: linear-gradient(90deg, #2563eb, #38bdf8);
      height: 100%;
      width: 0%;
      border-radius: 999px;
      transition: width 0.15s ease-out;
    }
    .stats {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 8px;
    }
    .status-text {
      font-size: 13px;
      color: #38bdf8;
      font-weight: 500;
    }
    .btn-container {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    button {
      flex: 1;
      padding: 12px 16px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background-color: #2563eb;
      color: white;
    }
    .btn-primary:hover:not(:disabled) {
      background-color: #1d4ed8;
    }
    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .btn-cancel {
      background-color: #dc2626;
      color: white;
      display: none;
    }
    .btn-cancel:hover {
      background-color: #b91c1c;
    }
    .note {
      font-size: 12px;
      color: #64748b;
      margin-top: 14px;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-icon">📥</div>
      <div class="header-title">
        <h1>Download de Aula HLS</h1>
        <p>Baixe os fragmentos e salve como MP4 ou TS diretamente</p>
      </div>
    </div>

    <div class="row">
      <div class="field-group" style="flex: 2;">
        <label for="filename">Nome do Arquivo:</label>
        <input type="text" id="filename" placeholder="Nome do arquivo..." value="aula_video.mp4">
      </div>
      <div class="field-group" style="flex: 1;">
        <label for="format-select">Formato:</label>
        <select id="format-select">
          <option value="mp4" selected>MP4 (.mp4)</option>
          <option value="ts">TS (.ts)</option>
        </select>
      </div>
    </div>

    <div class="field-group" id="quality-group" style="display: none;">
      <label for="quality-select">Qualidade Detectada:</label>
      <select id="quality-select"></select>
    </div>

    <div class="field-group">
      <label>URL da Playlist HLS:</label>
      <div id="stream-url-display" class="url-display">Carregando...</div>
    </div>

    <div class="progress-section" id="progress-section">
      <div class="stats">
        <span id="segments-stat">Segmentos: 0 / 0</span>
        <span id="size-stat">0 MB</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-bar"></div>
      </div>
      <div class="status-text" id="status-text">Iniciando conexão...</div>
    </div>

    <div class="btn-container">
      <button class="btn-primary" id="btn-start">Iniciar Download</button>
      <button class="btn-cancel" id="btn-cancel">Cancelar</button>
    </div>

    <div class="note">
      💡 <strong>Formato MP4:</strong> Transmuxado instantaneamente no navegador.<br>
      🎵 Para extrair <strong>MP3</strong> de alta qualidade, use o script <code>converter.bat</code> incluído na pasta do projeto!
    </div>
  </div>

  <script src="mux.min.js"></script>
  <script src="downloader.js"></script>
</body>
</html>
