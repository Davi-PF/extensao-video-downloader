<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>HLS Video Downloader</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 380px;
      padding: 14px;
      background-color: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #334155;
    }
    .header h2 {
      font-size: 15px;
      font-weight: 600;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      font-size: 11px;
      background-color: #1e293b;
      padding: 2px 8px;
      border-radius: 999px;
      color: #94a3b8;
    }
    .empty-state {
      padding: 24px 12px;
      text-align: center;
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.5;
      background: #1e293b;
      border-radius: 8px;
    }
    .empty-state span {
      font-size: 24px;
      display: block;
      margin-bottom: 8px;
    }
    .stream-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 380px;
      overflow-y: auto;
    }
    .stream-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .stream-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .quality-tag {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 4px;
      background-color: #0284c7;
      color: #ffffff;
    }
    .quality-tag.master {
      background-color: #16a34a;
    }
    .url-preview {
      font-size: 11px;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: monospace;
      background: #0f172a;
      padding: 4px 6px;
      border-radius: 4px;
    }
    .actions {
      display: flex;
      gap: 6px;
    }
    button {
      border: none;
      cursor: pointer;
      font-weight: 600;
      border-radius: 6px;
      transition: all 0.2s ease;
      font-size: 12px;
    }
    .btn-download {
      flex: 2;
      background-color: #2563eb;
      color: white;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-download:hover {
      background-color: #1d4ed8;
    }
    .btn-secondary {
      flex: 1;
      background-color: #334155;
      color: #cbd5e1;
      padding: 8px 6px;
    }
    .btn-secondary:hover {
      background-color: #475569;
      color: white;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>🎬 Vídeos da Aula</h2>
    <span id="video-count" class="badge">0 detectado(s)</span>
  </div>

  <div id="content">
    <div class="empty-state">
      <span>▶️</span>
      Nenhum vídeo HLS detectado ainda.<br>
      Dê <strong>play</strong> no vídeo da aula para que a extensão capture o link.
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
